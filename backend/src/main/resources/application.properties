### base de donné
spring.datasource.url=jdbc:mysql://localhost:3306/toolbox
spring.datasource.username=root
spring.datasource.password=pass

### hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

### debug sql
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

### execution scripts SQL
# spring.datasource.schema=classpath:schema.sql
# spring.datasource.data=classpath:data.sql
# spring.datasource.initialization-mode=always

### encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

### server
server.port=8080
server.servlet.context-path=/tool-box
#server.ssl.enabled=true
#server.ssl.key-store=classpath:keystore.p12
#server.ssl.key-store-password=yourpassword
#server.ssl.key-store-type=PKCS12
### api -> https://www.baeldung.com/spring-rest-openapi-documentation
springdoc.api-docs.path=/api
springdoc.swagger-ui.path=/api-swagger

### socket socket
app.socket.server.host=localhost
app.socket.server.port=9092

### security
spring.main.allow-bean-definition-overriding=true

### debug token
# logging.level.org.springframework.security=DEBUG
# logging.level.org.springframework.security.access.hierarchicalroles=DEBUG

### pour générer private.pem => openssl genpkey -algorithm RSA -out private.pem -pkeyopt rsa_keygen_bits:2048
rsa.private-key=classpath:certs/private_key.pem
### pour générer public.pem => openssl rsa -pubout -in private.pem -out public.pem
rsa.public-key=classpath:certs/public_key.pem

### exception
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false